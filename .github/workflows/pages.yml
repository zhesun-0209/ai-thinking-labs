name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build reviewed static files
        run: >-
          python scripts/build_site.py
          --site-url https://zhesun-0209.github.io/ai-thinking-labs/
          --output "$RUNNER_TEMP/site-release"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site-release/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
